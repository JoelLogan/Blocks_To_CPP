# pnpm workspace and supply-chain policy (docs/spec/08-security.md §8.9).
packages:
  - apps/desktop
  - packages/*
  - site

# Refuse package versions published less than 7 days ago (in minutes).
minimumReleaseAge: 10080
# Never auto-exempt a too-new version: pnpm fails in CI and other non-interactive runs
# (ERR_PNPM_NO_MATURE_MATCHING_VERSION) and asks before adding a minimumReleaseAgeExclude
# entry in a terminal. This is the default once minimumReleaseAge is set; it is kept
# explicit so it cannot be lost.
minimumReleaseAgeStrict: true
# Fail if a package's publishing trust evidence is weaker than earlier versions.
trustPolicy: no-downgrade
# Transitive dependencies may not come from git URLs or tarballs.
blockExoticSubdeps: true
# No dependency may run install scripts unless listed here with `true`;
# strictDepBuilds makes an unlisted build script fail the install instead of being skipped.
allowBuilds: {}
strictDepBuilds: true

# Fixed versions of vulnerable transitive dependencies that their parents pin.
overrides:
  # GHSA-238p-pmpm-9mq7 (katex <0.18.2): markdownlint's math syntax extension
  # (micromark-extension-math) asks for ^0.16 but never renders math; 0.18.2 is the fixed release.
  katex: 0.18.2
  # GHSA-gg6h-894w-4m9c (high; re2js >=2.2.0 <2.8.7, quadratic-time lookbehind matching):
  # markdownlint 0.42.0 (through markdownlint-cli2 0.24.0) pins 2.8.6. 2.8.8 is the last
  # 2.8 patch release; drop this once markdownlint pins 2.8.7 or later.
  re2js: 2.8.8

# Tracked `pnpm audit` exceptions (docs/spec/08-security.md §8.9). Each one names the
# only path that reaches the package and is reviewed by its date.
auditConfig:
  # None at present.
  ignoreGhsas: []

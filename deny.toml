# cargo-deny policy (docs/spec/08-security.md §8.9). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# Known-vulnerable or unmaintained crates fail the check; yanked versions too.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Permissive licences compatible with distributing Blocks2Cpp under Apache-2.0.
# MPL-2.0 (file-level copyleft) is allowed for unmodified dependencies only.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list covers the desktop app's dependencies too; not every licence appears in every build.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are not published; they carry the workspace licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[package]
name = "b2c-process"
description = "Blocks2Cpp process spawning with limits and whole-tree termination"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# The workspace features plus the pseudo-terminal calls (`pty`, `termios`),
# the standard descriptors for `TIOCSCTTY` (`stdio`) and `poll` for the
# session reader and writer (`event`); see src/pty/unix.rs.
rustix = { workspace = true, features = ["event", "pty", "stdio", "termios"] }

[target.'cfg(windows)'.dependencies]
# The workspace features plus Toolhelp, used to resume the main thread of a
# child created suspended (see src/platform/windows.rs), and the pseudo
# console and anonymous pipes for sessions (see src/pty/windows.rs).
windows-sys = { workspace = true, features = [
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

# The only crate allowed to contain `unsafe` (docs/spec/02-architecture.md §2.3):
# platform calls only, each with a `// SAFETY:` comment and CODEOWNERS review.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

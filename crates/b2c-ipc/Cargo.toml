[package]
name = "b2c-ipc"
description = "Blocks2Cpp IPC contract: request and response types, opaque IDs, errors, limits and the command table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Every dependency needs a justification (docs/spec/08-security.md §8.9).
[dependencies]
b2c-ir.workspace = true
b2c-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# ToolchainId: SHA-256 of the canonical driver path.
sha2.workspace = true
# The 128-bit opaque IDs come from the OS CSPRNG.
getrandom.workspace = true
# TypeScript bindings, generated by tests/generate.rs. Only that test enables the
# feature; app builds never compile ts-rs.
ts-rs = { workspace = true, optional = true }

[features]
# Derives ts_rs::TS on every IPC type and builds the generators in `generate`.
ts = ["dep:ts-rs"]

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true

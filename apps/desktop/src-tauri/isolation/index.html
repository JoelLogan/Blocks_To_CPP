<!doctype html>
<!--
  The isolation application (docs/spec/08-security.md §8.8). Tauri loads it in a
  sandboxed iframe and passes every IPC message from the editor through
  `window.__TAURI_ISOLATION_HOOK__` before the backend sees it.

  The three scripts run in this order (Tauri inlines them when it builds the app):
  the allowlist generated from the Rust command table (crates/b2c-ipc), the
  message validator, and the hook that uses both.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blocks2Cpp IPC isolation</title>
  </head>
  <body>
    <script src="allowlist.generated.js"></script>
    <script src="validate.js"></script>
    <script src="index.js"></script>
  </body>
</html>

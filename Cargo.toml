[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# A plain `cargo build`, `test` or `clippy` at the root builds the compiler crates and the CLI
# only, so it needs no webview libraries. The desktop app is built with `-p blocks2cpp-desktop`
# (see apps/desktop/README.md and .github/workflows/desktop.yml).
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/JoelLogan/Blocks_To_CPP"
publish = false

[workspace.dependencies]
# Internal crates (layering: docs/spec/02-architecture.md §2.3).
b2c-model = { path = "crates/b2c-model" }
b2c-catalog = { path = "crates/b2c-catalog" }
b2c-ir = { path = "crates/b2c-ir" }
b2c-lang = { path = "crates/b2c-lang" }
b2c-codegen = { path = "crates/b2c-codegen" }
b2c-toolchain = { path = "crates/b2c-toolchain" }
b2c-process = { path = "crates/b2c-process" }
b2c-build = { path = "crates/b2c-build" }
b2c-core-wasm = { path = "crates/b2c-core-wasm" }
b2c-store = { path = "crates/b2c-store" }
b2c-ipc = { path = "crates/b2c-ipc" }

# Third-party crates. Every addition needs a justification in the PR (spec §8.9).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
thiserror = "2.0.21"
sha2 = "0.11.0"
# OS CSPRNG for the opaque IPC IDs (b2c-ipc); already in the lockfile through tempfile.
getrandom = "0.3.4"
# TypeScript bindings for the IPC types (b2c-ipc, feature `ts`, never in app builds).
ts-rs = "12.0.1"
# Structured logging with spans per build and run session (09 §9.1, 08 §8.11); already in the
# lockfile through Tauri. No default features: no `log` bridge and no proc-macro attributes.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
rustix = { version = "1.1.5", features = ["process"] }
# Signal actions in a session's child before exec (b2c-process, Unix), which rustix
# does not offer; already in the lockfile through getrandom and tempfile.
libc = { version = "0.2.190", default-features = false }
# The editor's WebAssembly facade (b2c-core-wasm). Exact pin: the wasm-bindgen CLI that
# generates the JavaScript glue must be the same version.
wasm-bindgen = "=0.2.129"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Test-only.
proptest = "1.11.0"
insta = "1.48.0"
regex = "1.13.1" # golden tests: outputs that vary between runs (e.g. random numbers)

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"

[profile.release]
debug = false
strip = "symbols"

# The editor's WebAssembly build of b2c-core-wasm (packages/b2c-core-wasm/scripts/build.mjs):
# smallest code, whole-program optimisation, and abort on panic (the frontend
# re-instantiates the module after a trap).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

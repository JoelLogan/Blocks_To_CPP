name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems go to private vulnerability reporting instead** (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Steps, and if possible the smallest project file (.b2c) that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Blocks2Cpp version
  - type: input
    id: platform
    attributes:
      label: Operating system and g++ version
      placeholder: "Windows 11, MSYS2 UCRT64 g++ 15.2"

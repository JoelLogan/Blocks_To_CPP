# Keeps pinned GitHub Actions and npm dependencies current (docs/spec/08-security.md §8.9).
# Updates wait 7 days after release, matching the pnpm minimumReleaseAge policy.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns:
          - "*"

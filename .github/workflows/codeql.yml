# CodeQL code scanning (docs/spec/08-security.md §8.9).
name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 4 * * 2" # Tuesdays 04:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning needs a public repository or GitHub Code Security (then set
    # the repository variable B2C_CODE_SCANNING to "true"); CodeQL's licence
    # also limits it to those cases for private code.
    if: ${{ github.event.repository.visibility == 'public' || vars.B2C_CODE_SCANNING == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # read workflow run details (required on private repositories)
      contents: read # check out the repository
      security-events: write # upload code scanning results
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

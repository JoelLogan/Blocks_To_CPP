# Continuous integration (docs/spec/09-quality-and-delivery.md §9.3).
# Rust jobs use the toolchain pinned in rust-toolchain.toml; the desktop app has
# its own workflow (desktop.yml) and is not a default workspace member.
name: CI

on:
  push:
    branches: ["**"] # every branch (work happens on branches before a PR exists); not tags
  pull_request:
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC: catch advisories published since the last change
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      # --all-features also lints code behind features, such as b2c-ipc's `ts` (the TypeScript
      # and isolation-allowlist generator), which nothing else builds with clippy.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Which crates may depend on which, and that the pure compiler crates
      # use no I/O crates (docs/spec/02-architecture.md §2.3).
      - name: Crate layering rules
        run: python3 tools/check-layering.py

      # The weekly dependency health report (weekly.yml), checked against stand-ins for
      # cargo-deny and pnpm, so a broken report script is found before the weekly run.
      - name: Dependency health report script (self-test)
        run: tools/dependency-health.sh --self-test

      # The fuzz targets live in their own workspace (fuzz/); make sure they
      # still build with the pinned stable toolchain.
      - name: Check the fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

      # Platform-specific code (process containment, file permissions) is
      # linted for Windows too; checking needs no Windows linker.
      - name: Clippy (Windows target)
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --locked --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies under the supply-chain policy
        run: pnpm install --frozen-lockfile

      # Every Markdown file of the repository, with the rules in
      # .markdownlint-cli2.jsonc (default rules; long lines and table padding
      # allowed; no inline HTML).
      - name: Markdown lint
        run: pnpm exec markdownlint-cli2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install g++ (MSYS2 UCRT64)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put g++ on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:MSYS2_LOCATION 'ucrt64\bin')

      - name: Show g++ version
        run: g++ --version

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Shows what `b2c` finds and why a compiler is rejected; informational,
      # so it never fails the job (the tests below do).
      - name: Show the compilers Blocks2Cpp finds
        shell: bash
        run: cargo run --locked --quiet -p b2c-cli -- toolchains || true

      - name: Test
        run: cargo test --locked
        env:
          B2C_REQUIRE_GXX: "1" # fail, rather than skip, tests that need g++

  # The oldest supported GCC (b2c_toolchain::probe::MIN_GCC_MAJOR) and the
  # newest, next to the Linux job's GCC 13 (spec §9.2, golden end-to-end), in
  # the official gcc images pinned by digest. Only the crates that compile C++
  # are tested here; the others do not depend on the compiler.
  gcc:
    name: Test with GCC ${{ matrix.gcc }} (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - gcc: "11"
            image: gcc:11@sha256:63aaebc5db8930a70241051619cba77781a5466fb3e4dc99d2ff3b752cb715f2 # 11.5.0
          - gcc: "15"
            image: gcc:15@sha256:ead103e6d03b69232962d467f3520c3f70b6718c69ff71efcc08efe9011fadb6 # 15.3.0
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      # The images have no Rust; rustup-init is pinned and its checksum checked.
      RUSTUP_VERSION: 1.29.1
      RUSTUP_INIT_SHA256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum --check --strict
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Show g++ version
        run: g++ --version

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Show the compilers Blocks2Cpp finds
        run: cargo run --locked --quiet -p b2c-cli -- toolchains || true

      - name: Test
        run: cargo test --locked --no-fail-fast -p b2c-lang -p b2c-codegen -p b2c-build -p b2c-cli
        env:
          B2C_REQUIRE_GXX: "1" # fail, rather than skip, tests that need g++

  # Line coverage of the Rust code (docs/spec/09-quality-and-delivery.md §9.2):
  # at least 80% over all default workspace members, and at least 90% over the
  # core compiler crates together. Measured once, with g++ so the tests that
  # compile C++ run instead of skipping. Tests that spawn our own binaries
  # must keep LLVM_PROFILE_FILE in the child's environment (the `b2c` CLI
  # tests inherit it), or those runs are not counted.
  coverage:
    name: Coverage gates (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    env:
      CARGO_LLVM_COV_VERSION: 0.9.1
      # The core compiler crates (docs/spec/02-architecture.md §2.3).
      CORE_CRATES: -p b2c-ir -p b2c-model -p b2c-catalog -p b2c-lang -p b2c-codegen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show g++ version
        run: g++ --version

      - name: Install the pinned Rust toolchain and the LLVM tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"

      - name: Run the tests with coverage instrumentation
        run: cargo llvm-cov --locked --no-report
        env:
          B2C_REQUIRE_GXX: "1" # fail, rather than skip, tests that need g++

      # The report and the summary come before the gates, so they exist even
      # when a gate fails.
      - name: Write the lcov report and the job summary
        run: |
          set -euo pipefail
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/lcov.info"
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/all.json"
          # shellcheck disable=SC2086 # CORE_CRATES expands to several -p arguments
          cargo llvm-cov report $CORE_CRATES --json --summary-only --output-path "$RUNNER_TEMP/core.json"
          python3 - "$RUNNER_TEMP/all.json" "$RUNNER_TEMP/core.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, re, sys
          from collections import defaultdict

          def load(path):
              with open(path, encoding="utf-8") as f:
                  return json.load(f)["data"][0]

          def pct(covered, count):
              return f"{100 * covered / count:.1f}%" if count else "n/a"

          everything, core = (load(path) for path in sys.argv[1:3])
          print("## Rust line coverage\n")
          print("| Scope | Lines | Covered | Coverage | Gate |")
          print("|---|---:|---:|---:|---:|")
          for name, data, gate in (("All default members", everything, 80), ("Core compiler crates", core, 90)):
              lines = data["totals"]["lines"]
              print(f"| {name} | {lines['count']} | {lines['covered']} | {pct(lines['covered'], lines['count'])} | {gate}% |")
          crates = defaultdict(lambda: [0, 0])
          for file in everything["files"]:
              match = re.search(r"(?:^|/)crates/([^/]+)/", file["filename"])
              name = match.group(1) if match else "other"
              crates[name][0] += file["summary"]["lines"]["count"]
              crates[name][1] += file["summary"]["lines"]["covered"]
          print("\n| Crate | Lines | Covered | Coverage |")
          print("|---|---:|---:|---:|")
          for name, (count, covered) in sorted(crates.items()):
              print(f"| `{name}` | {count} | {covered} | {pct(covered, count)} |")
          EOF

      - name: Upload the lcov report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: ${{ runner.temp }}/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: "Gate: all default members, at least 80% of lines"
        run: cargo llvm-cov report --summary-only --fail-under-lines 80

      # Only the core crates' files count here.
      - name: "Gate: core compiler crates, at least 90% of lines"
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086 # CORE_CRATES expands to several -p arguments
          cargo llvm-cov report $CORE_CRATES --summary-only --fail-under-lines 90

  wasm:
    name: WebAssembly build and size budget
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    env:
      # wasm-opt from binaryen, pinned by release and checked against the
      # SHA-256 published with it, like rustup-init in the gcc job.
      BINARYEN_VERSION: "133"
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      # ADR-0003: at most 2 MB after `wasm-opt -Oz`, read strictly as bytes.
      WASM_BUDGET_BYTES: "2000000"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # The pure compiler crates and the WebAssembly facade must stay free of
      # I/O (ADR-0003).
      - name: Check wasm32 build
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p b2c-ir -p b2c-model -p b2c-catalog -p b2c-lang -p b2c-codegen -p b2c-core-wasm

      # The CLI must be the exact version of the wasm-bindgen crate in
      # Cargo.lock, or the generated glue does not match the module.
      - name: Install wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --locked --version "$version"

      - name: Install wasm-opt (binaryen)
        run: |
          set -euo pipefail
          archive="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${archive}"
          echo "${BINARYEN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies under the supply-chain policy
        run: pnpm install --frozen-lockfile

      # cargo build (profile wasm-release), wasm-bindgen --target web, then
      # wasm-opt -Oz, into packages/b2c-core-wasm/pkg/.
      - name: Build the WebAssembly package
        run: |
          wasm-opt --version
          pnpm --filter @blocks2cpp/b2c-core-wasm build

      - name: Check the size budget
        run: |
          set -euo pipefail
          shopt -s nullglob
          raw=target/wasm32-unknown-unknown/wasm-release/b2c_core_wasm.wasm
          optimised=(packages/b2c-core-wasm/pkg/*.wasm)
          if [ ! -f "$raw" ] || [ "${#optimised[@]}" -ne 1 ]; then
            echo "::error::Expected $raw and exactly one .wasm in packages/b2c-core-wasm/pkg/"
            exit 1
          fi
          raw_bytes=$(stat --format=%s "$raw")
          opt_bytes=$(stat --format=%s "${optimised[0]}")
          gzip_bytes=$(gzip -9 --stdout "${optimised[0]}" | wc -c)
          {
            echo "## WebAssembly core size"
            echo
            echo "| Build | Bytes |"
            echo "|---|---:|"
            echo "| Raw (cargo, wasm-release) | $raw_bytes |"
            echo "| After wasm-opt -Oz | $opt_bytes |"
            echo "| After wasm-opt, gzip -9 (reported only) | $gzip_bytes |"
            echo "| Budget (after wasm-opt) | $WASM_BUDGET_BYTES |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$opt_bytes" -gt "$WASM_BUDGET_BYTES" ]; then
            echo "::error::The optimised WebAssembly core is $opt_bytes bytes, over the budget of $WASM_BUDGET_BYTES"
            exit 1
          fi
          echo "The optimised WebAssembly core is $opt_bytes bytes (budget $WASM_BUDGET_BYTES)"

  fuzz:
    name: Fuzz smoke test (60 s per target)
    runs-on: ubuntu-24.04
    # About 11 targets at 60 s each, plus their builds and the tool setup.
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    env:
      # libFuzzer needs nightly; pinned so runs are reproducible. Bump both
      # together, keeping each at least 7 days old (docs/spec/08-security.md §8.9).
      FUZZ_TOOLCHAIN: nightly-2026-09-25
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo "+$FUZZ_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      # Every target `cargo fuzz list` prints, so new targets need no change
      # here. Each uses fuzz/<target>.dict, or fuzz/b2c.dict when it has none,
      # and starts from its own corpus (fuzz/README.md):
      # * project-file targets: the examples and the security suite;
      # * encoders and unknown targets: empty;
      # * diagnostics parsers: the recorded g++ output under
      #   crates/b2c-toolchain/tests/fixtures/ (diag_output adds its mode byte
      #   and joins standard error and the SARIF file with \0sarif\0). Their
      #   -max_len is left to libFuzzer, as GCC's SARIF files are ~300 KiB.
      - name: Fuzz each target for 60 seconds
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=crates/b2c-toolchain/tests/fixtures
          separator="$RUNNER_TEMP/sarif-separator"
          printf '\000sarif\000' > "$separator"
          # Copies files into $dir as <fixture folder>-<file name>.
          copy_tagged() {
            local file
            for file in "$@"; do
              cp "$file" "$dir/$(basename "$(dirname "$file")")-$(basename "$file")"
            done
          }
          # output_seed NAME MODE FILE...: a diag_output seed, the mode byte
          # (three octal digits) followed by the files.
          output_seed() {
            local name=$1 mode=$2
            shift 2
            { printf '%b' "\\0$mode"; cat "$@"; } > "$dir/$name"
          }
          seed() {
            case "$target" in
              load | resolve | roundtrip | frontend | clipboard)
                cp examples/*.b2c tests/security/projects/*.b2c "$dir/"
                if [ "$target" = clipboard ]; then
                  for file in tests/security/clipboard/*.json; do cp "$file" "$dir/"; done
                fi
                ;;
              diag_sarif) copy_tagged "$fixtures"/*/*.sarif ;;
              diag_json) copy_tagged "$fixtures"/*/*.json ;;
              diag_text) copy_tagged "$fixtures"/*/*.txt ;;
              diag_output)
                for sarif in "$fixtures"/*/*.sarif; do
                  base=${sarif%.sarif}
                  tag="$(basename "$(dirname "$base")")-$(basename "$base")"
                  for mode in 004 005; do
                    output_seed "$tag-$mode" "$mode" "$base.sarif-stderr.txt" "$separator" "$sarif"
                  done
                done
                for json in "$fixtures"/*/*.json; do
                  tag="$(basename "$(dirname "$json")")-$(basename "${json%.json}")"
                  output_seed "$tag-002" 002 "$json"
                done
                for plain in "$fixtures"/*/*.plain.txt; do
                  tag="$(basename "$(dirname "$plain")")-$(basename "${plain%.plain.txt}")"
                  output_seed "$tag-003" 003 "$plain"
                  output_seed "$tag-001" 001 "$plain"
                done
                ;;
              *) ;;
            esac
          }
          targets=$(cargo "+$FUZZ_TOOLCHAIN" fuzz list)
          echo "Targets: $targets"
          for target in $targets; do
            dir="$RUNNER_TEMP/corpus/$target"
            mkdir -p "$dir"
            seed
            dict="fuzz/$target.dict"
            [ -f "$dict" ] || dict=fuzz/b2c.dict
            args=("-dict=$dict" -max_total_time=60)
            case "$target" in
              encoders) args+=(-max_len=1024) ;;
              diag_*) ;;
              *) args+=(-max_len=65536) ;;
            esac
            echo "::group::$target ($(find "$dir" -type f | wc -l) seeds, $dict)"
            cargo "+$FUZZ_TOOLCHAIN" fuzz run "$target" "$dir" -- "${args[@]}"
            echo "::endgroup::"
          done

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  # API docs, generated files and links (docs/spec/09-quality-and-delivery.md
  # §9.3 and §9.4). The checks are independent, so each runs even when an
  # earlier one failed, and the job reports all of them.
  docs:
    name: Docs, generated files and links
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the link check compares with the base commit

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Every diagnostic code is documented
        run: python3 tools/check-diagnostics-docs.py

      # The default members (crates/*); the desktop crate needs WebKitGTK and
      # is built in desktop.yml. A broken intra-doc link fails the build.
      - name: API docs build without warnings (rustdoc)
        if: ${{ !cancelled() }}
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # packages/ipc-types and the isolation allowlist are generated from the
      # Rust IPC contract (b2c-ipc) and committed (docs/spec/02-architecture.md
      # §2.5); regenerating must change nothing, new files included.
      - name: IPC types and isolation allowlist are up to date
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked -p b2c-ipc --features ts --test generate
          paths=(packages/ipc-types
            apps/desktop/src-tauri/isolation/allowlist.generated.js
            apps/desktop/src-tauri/isolation-tests/samples.generated.json)
          if [ -n "$(git status --porcelain --untracked-files=all -- "${paths[@]}")" ]; then
            git status --short --untracked-files=all -- "${paths[@]}"
            git diff -- "${paths[@]}"
            echo "::error::Generated IPC files are stale: run 'cargo test -p b2c-ipc --features ts --test generate' and commit the result"
            exit 1
          fi

      - name: Set up pnpm (version from package.json)
        if: ${{ !cancelled() }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies under the supply-chain policy
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      # catalog/ is exported by b2c-catalog as packages/catalog-gen/catalog.json,
      # from which catalog-gen generates the Blockly definitions and the block
      # reference (docs/spec/09-quality-and-delivery.md §9.4).
      - name: Catalog export, Blockly definitions and block reference are up to date
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked -p b2c-catalog --test export
          pnpm --filter @blocks2cpp/catalog-gen run generate
          paths=(packages/catalog-gen/catalog.json packages/blockly-ext/src/generated docs/reference/blocks)
          if [ -n "$(git status --porcelain --untracked-files=all -- "${paths[@]}")" ]; then
            git status --short --untracked-files=all -- "${paths[@]}"
            git diff -- "${paths[@]}"
            echo "::error::Generated catalog files are stale: run 'cargo test -p b2c-catalog --test export' and 'pnpm --filter @blocks2cpp/catalog-gen run generate', and commit the result"
            exit 1
          fi

      # Pull requests and pushes check external links only when Markdown (or
      # this check's configuration) changed, so an unrelated change is not
      # failed by a site that is down; scheduled and manual runs always check.
      - name: Decide whether to check external links
        id: links
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            push) base=$PUSH_BEFORE ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Scheduled or manual run, a new branch, or no usable base.
            check=true
          elif git diff --name-only "$base" HEAD -- '*.md' lychee.toml .github/workflows/ci.yml | grep -q .; then
            check=true
          else
            check=false
          fi
          echo "Check external links: $check"
          echo "check=$check" >> "$GITHUB_OUTPUT"

      # lychee.toml: 3 retries; 200, 206 and 429 accepted; local hosts and
      # example.com excluded. No token, so nothing private can be reached.
      - name: External links (lychee)
        if: ${{ !cancelled() && steps.links.outputs.check == 'true' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress './**/*.md'
          token: ""
          fail: true
          jobSummary: true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the full history to scan
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  security:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the lockfile to audit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify the lockfile installs under the supply-chain policy
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for known vulnerabilities
        run: pnpm audit

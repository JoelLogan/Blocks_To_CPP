# Audits GitHub Actions workflows with zizmor (docs/spec/08-security.md §8.9).
# - On changes to .github/: offline audits, which are deterministic.
# - Weekly and on manual runs: online audits too, which query GitHub for newly
#   published advisories against the actions we use (for example a pinned action
#   version that later turns out to be vulnerable).
# The zizmor version is pinned below. When Dependabot updates zizmor-action, bump
# `version:` to the newest version the action has a lock file for (support/locks/,
# where zizmor-latest.txt names it), once that release is at least 7 days old.
name: Workflow audit

on:
  push:
    branches: ["**"]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the workflows to audit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        # The action downloads the zizmor wheel for the requested version from PyPI with
        # pip --require-hashes, against the hashes in its own support/locks/ (python3 on the runner).
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          persona: auditor
          # Online audits read public advisories with the read-only job token.
          online-audits: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # Uploading SARIF would need security-events: write; results show in the job log.
          advanced-security: false

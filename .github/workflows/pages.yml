# Builds the specification website from docs/ on every change, and deploys it
# to GitHub Pages from the default branch. Pull requests only build, so broken
# links or raw HTML in the docs fail the check before merge.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pages

on:
  push:
    paths:
      - "docs/**"
      - "site/**"
      - "LICENSE"
      - "SECURITY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "LICENSE"
      - "SECURITY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # No dependency caching in a workflow that deploys (cache-poisoning risk).
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm site:build
        env:
          B2C_SITE_COMMIT: ${{ github.sha }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the uploaded artifact to GitHub Pages
      id-token: write # OIDC token that deploy-pages uses to prove the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

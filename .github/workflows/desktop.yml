# The desktop app (apps/desktop): lint and build the frontend, then lint, test and build the
# Tauri app on Linux and Windows and check that it starts (docs/spec/10-roadmap.md, M0).
# The app is not a default member of the Cargo workspace, so ci.yml's root `cargo` commands
# skip it; this workflow covers it. Installers (MSI, NSIS, AppImage, deb, rpm) are built by
# the release workflow once there is one (M6), so this one builds the executable only.
name: Desktop

on:
  push:
    branches: ["**"]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend (typecheck, lint, format, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies under the supply-chain policy
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @blocks2cpp/desktop run typecheck

      - name: Lint (ESLint, including the security rules)
        run: pnpm --filter @blocks2cpp/desktop run lint

      - name: Check formatting (Prettier)
        run: pnpm --filter @blocks2cpp/desktop run format:check

      - name: Build
        run: pnpm --filter @blocks2cpp/desktop run build

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WebKitGTK and GTK for the webview (https://v2.tauri.app/start/prerequisites/), and a
      # virtual display for the start-up check. Windows runners already have WebView2.
      - name: Install the webview libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev xvfb

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install dependencies under the supply-chain policy
        run: pnpm install --frozen-lockfile

      - name: Clippy
        run: cargo clippy --locked -p blocks2cpp-desktop --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -p blocks2cpp-desktop

      # A release build of the executable with the frontend embedded, as it ships: the
      # Content Security Policy applies and the web inspector is compiled out.
      - name: Build the app
        run: pnpm --filter @blocks2cpp/desktop tauri build --no-bundle

      - name: Check that the app starts (Linux)
        if: runner.os == 'Linux'
        env:
          # A virtual display has no GPU (docs/spec/02-architecture.md §2.8).
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          status=0
          timeout 20 xvfb-run --auto-servernum target/release/blocks2cpp-desktop \
            > "$RUNNER_TEMP/app.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/app.log"
          # 124: still running when the time ran out, which is what we want.
          if [ "$status" -ne 124 ]; then
            echo "::error::The app exited with status $status within 20 seconds"
            exit 1
          fi

      - name: Check that the app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'target\release\blocks2cpp-desktop.exe' -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            Write-Output "::error::The app exited with code $($app.ExitCode) within 20 seconds"
            exit 1
          }
          Stop-Process -Id $app.Id

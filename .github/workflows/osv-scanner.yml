# Known-vulnerability scan of every lockfile (Cargo.lock, pnpm-lock.yaml) with
# OSV-Scanner (docs/spec/08-security.md §8.9).
name: OSV-Scanner

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "7 6 * * *" # daily 06:07 UTC
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan lockfiles
    permissions:
      actions: read # the reusable workflow reads its own artifacts
      contents: read # check out the repository
      security-events: write # upload results to code scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-24.04
      # The scan always runs and fails on known vulnerabilities. Uploading the
      # results to code scanning needs a public repository or GitHub Code
      # Security (then set the repository variable B2C_CODE_SCANNING to "true").
      upload-sarif: ${{ github.event.repository.visibility == 'public' || vars.B2C_CODE_SCANNING == 'true' }}
      scan-args: |-
        --recursive
        ./

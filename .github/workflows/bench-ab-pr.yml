# The A/B benchmarks of a pull request (docs/spec/09-quality-and-delivery.md §9.2,
# apps/desktop/e2e/bench/README.md "A/B runs"): the regression gate at pull request time. The jobs
# are bench-ab-run.yml's; this workflow starts them and chooses the base.
#
# Started by the `bench-ab` label on a pull request (when it is added, and on every push to the
# pull request while it has the label). The head is the pull request merged into its base branch
# (the merge commit GitHub makes for the event, github.sha) and the base is that commit's first
# parent, the base branch it was merged into: the two differ by the pull request's changes only,
# so what landed on the base branch after the pull request branched off counts for neither, and
# the head's acceptance file is the merged one. A change expected to alter a gated metric runs
# it; W4-2, W5-1 and W3-11 of the M2 polish wave merge only with a green run attached (or once
# their metrics have 5 nightly baselines). The run takes every benchmark but cold start, so it
# covers the metric of each: the toolbox's listing (select, W4-2), dragging (drag, W5-1) and the
# console's output (console, W3-11).
#
# This workflow builds and runs a pull request's code, so pull_request is its only trigger: GitHub
# gives such a run a read-only token and the pull request's own cache scope, never the default
# branch's. Give it no other trigger; a manual run is bench-ab.yml, which runs only commits of the
# repository's own history.
name: Bench A/B (pull request)

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions: {}

# A newer push or bench-ab label event replaces a run that has not finished for the same pull
# request. Adding another label starts no run, so it gets a group of its own and cancels nothing.
concurrency:
  group: bench-ab-pr-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'bench-ab') && github.run_id || 'ab' }}
  cancel-in-progress: true

jobs:
  base:
    name: Choose the base
    # A label event starts it only for the bench-ab label; other events need the label on the
    # pull request.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'bench-ab') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'bench-ab'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # read the pull request's merge commit and its parents
    outputs:
      base: ${{ steps.base.outputs.base }}
    steps:
      # The merge commit of the event (its default ref) with its parents, for their IDs; one small
      # file of its tree is enough.
      - name: Check out the pull request's merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: merge
          fetch-depth: 2
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Take the merge commit's first parent as the base
        id: base
        working-directory: merge
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$RUN_SHA" ]; then
            echo "::error::The checkout is not the event's merge commit $RUN_SHA"
            exit 1
          fi
          base=$(git rev-parse --verify 'HEAD^1')
          merged=$(git rev-parse --verify 'HEAD^2' 2> /dev/null || true)
          if [ "$merged" != "$PR_HEAD" ]; then
            echo "::error::The merge commit $RUN_SHA does not merge the pull request's head $PR_HEAD (it merges '$merged'); push again"
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          {
            echo "### A/B commits"
            echo
            echo "- Base: \`$base\` (the base branch)"
            echo "- Head: \`$RUN_SHA\` (the pull request's \`$PR_HEAD\` merged into the base)"
          } >> "$GITHUB_STEP_SUMMARY"

  ab:
    name: A/B
    needs: base
    permissions:
      contents: read # check out the repository
    # The called workflow comes from this run's commit. Not `$/...` (zizmor's self-repository):
    # actionlint 1.7.12 rejects it, and CodeQL 2.27.2 does not follow it, so its analysis of the
    # called jobs would no longer see this workflow's trigger.
    uses: ./.github/workflows/bench-ab-run.yml # zizmor: ignore[self-repository]
    with:
      base: ${{ needs.base.outputs.base }}
      metrics: preview select guessing console drag
      systems: both

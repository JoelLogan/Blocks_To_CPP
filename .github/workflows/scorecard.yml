# OpenSSF Scorecard supply-chain checks (docs/spec/08-security.md §8.9).
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: ["main"]
  schedule:
    - cron: "33 3 * * 3" # Wednesdays 03:33 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    # Uploading results needs a public repository or GitHub Code Security (then
    # set the repository variable B2C_CODE_SCANNING to "true").
    if: ${{ github.event.repository.visibility == 'public' || vars.B2C_CODE_SCANNING == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # read the repository
      actions: read # read workflow runs
      security-events: write # upload results to code scanning
      id-token: write # sign published results (publish_results)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishing to the OpenSSF API works only for public repositories.
          publish_results: ${{ github.event.repository.visibility == 'public' }}

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif

# The editor's toolbox (docs/spec/03-block-language.md §3.11.1, docs/spec/04-user-interface.md §4.2).
#
# Categories come in the order of §3.7. Each has a name, an icon (so colour is never the only
# cue) and a colour token, which is the category ID; the colour values live in the editor theme.
# `dynamic` marks a category whose blocks the editor adds for the open project: `variables`
# (a getter for each variable, and the blocks that change a variable, *set* and *change*, with
# one already chosen) and `functions` (under *Your functions*, a call block for every function
# of the module shown).
#
# Entries are shown in order. An entry names a block, with an optional label (shown above it)
# and an optional preset: field values, `extra` values and input tokens that differ from the
# catalog defaults. A preset fills in values; it never stands in for a choice the block offers
# in place (a dropdown, a ⊕/⊖ part or a checkbox), so each block has at most one entry (spec
# §3.1, "One idea, one block, one toolbox entry"). b2c-catalog validates this file against the
# catalog (every block exists, sits in its own category and has one entry at most, every catalog
# block is reachable, no label is a category name, presets fit their block), and the block
# definitions and the block reference are generated from the validated result
# (packages/catalog-gen).

[[category]]
id = "program"
name = "Program"
icon = "▶"
colour = "program"

[[category.entry]]
block = "program.main"

[[category.entry]]
block = "program.exit"

[[category]]
id = "variables"
name = "Variables"
icon = "𝑥"
colour = "variables"
dynamic = "variables"

[[category.entry]]
block = "var.declare"
preset = { fields = { TYPE = "int" }, inputs = { VALUE = [{ num = "0" }] } }


# Files (docs/spec/03-block-language.md §3.7.10; docs/plans/m3-contracts/w2.md
# §1.8, §2.4). A program opens exactly the paths its blocks hold, as text, at
# run time (decision M3-D3); a relative path is relative to the folder the
# program runs in, the project folder by default.

[[block]]
id = "file.for_each_line"
version = 1
category = "files"
shape = "statement"
label = { friendly = "for each line %LINE in file %PATH %BODY if it can't be opened %FAILED", cpp = "while (std::getline(file, %LINE)) { … }" }
lowering = "builtin"
help = "Reads a text file line by line and runs blocks for each line, without its line break. A path that is not a full path is looked for in the folder the program runs in: the project folder, or its sandbox folder when the run settings choose it or the project is not saved yet. Add the part that runs when the file can't be opened with ⊕; without it, nothing runs when the file can't be opened."

[[block.extra]]
name = "hasFailed"
kind = "flag"
max = 1
default = false

[[block.field]]
name = "LINE"
kind = "symbol_decl"
type = "std::string"

[[block.input]]
name = "PATH"
check = "text"
type = "std::string"
default = [{ str = "data.txt" }]

[[block.statement]]
name = "BODY"

[[block.statement]]
name = "FAILED"
when = "hasFailed"

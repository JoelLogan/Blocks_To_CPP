# Files (docs/spec/03-block-language.md §3.7.10; docs/plans/m3-contracts/w2.md
# §1.8, §2.4). A program opens exactly the paths its blocks hold, as text, at
# run time (decision M3-D3); a relative path is relative to the folder the
# program runs in, the project folder by default.

[[block]]
id = "file.for_each_line"
version = 1
category = "files"
shape = "statement"
label = { friendly = "for each line %LINE in file %PATH %BODY if it can't be opened %FAILED", cpp = "while (std::getline(file, %LINE)) { … }" }
lowering = "builtin"
help = "Reads a text file line by line and runs blocks for each line, without its line break. A path that is not a full path is looked for in the folder the program runs in: the project folder, or its sandbox folder when the run settings choose it or the project is not saved yet. Add the part that runs when the file can't be opened with ⊕; without it, nothing runs when the file can't be opened."

[[block.extra]]
name = "hasFailed"
kind = "flag"
max = 1
default = false

[[block.field]]
name = "LINE"
kind = "symbol_decl"
type = "std::string"

[[block.input]]
name = "PATH"
check = "text"
type = "std::string"
default = [{ str = "data.txt" }]

[[block.statement]]
name = "BODY"

[[block.statement]]
name = "FAILED"
when = "hasFailed"

# W2's package S: the if-time rows of package D (docs/plans/m3-contracts/
# w2.md §1.8). *open file* declares its stream, typed by MODE (an input file
# for reading, an output file otherwise; §2.4), visible after the block in
# its list and in its *if it can't be opened* part. The stream closes at the
# end of that list.
[[block]]
id = "file.open"
version = 1
category = "files"
shape = "statement"
label = { friendly = "open file %PATH for %MODE as %FILE if it can't be opened %FAILED", cpp = "std::ifstream %FILE(%PATH);" }
lowering = "builtin"
help = "Opens a text file to read it line by line, to write it from the start, or to add to its end, and names it for the blocks after this one. A path that is not a full path is looked for in the folder the program runs in. Add the part that runs when the file can't be opened with ⊕. The file closes at the end of the group of blocks this block is in."

[[block.extra]]
name = "hasFailed"
kind = "flag"
max = 1
default = false

[[block.field]]
name = "FILE"
kind = "symbol_decl"

[[block.field]]
name = "MODE"
kind = "dropdown"
options = [["reading", "read"], ["writing", "write"], ["adding to the end", "append"]]
default = "read"

[[block.input]]
name = "PATH"
check = "text"
type = "std::string"
default = [{ str = "data.txt" }]

[[block.statement]]
name = "FAILED"
when = "hasFailed"

[[block]]
id = "file.read_line"
version = 1
category = "files"
shape = "predicate"
output = "bool"
label = { friendly = "read line from %FILE into %LINE", cpp = "std::getline(%FILE, %LINE)" }
lowering = "builtin"
help = "Reads the next line of a file opened for reading into a text variable, without its line break. True when there was a line to read, false at the end of the file, so it can be the condition of a loop."

[[block.field]]
name = "FILE"
kind = "symbol_ref"
type = "std::ifstream"

[[block.field]]
name = "LINE"
kind = "symbol_ref"
type = "std::string"

[[block]]
id = "file.write"
version = 1
category = "files"
shape = "statement"
label = { friendly = "write %ITEM … to %FILE new line %NEWLINE", cpp = "%FILE << %ITEM << …;" }
lowering = "builtin"
help = "Writes values to a file opened for writing or for adding to its end, as print shows them in the console. Untick new line to go on writing on the same line."

[[block.field]]
name = "FILE"
kind = "symbol_ref"
type = "std::ofstream"

[[block.field]]
name = "NEWLINE"
kind = "checkbox"
default = true

[[block.extra]]
name = "itemCount"
kind = "count"
min = 1
max = 32
default = "1"

[[block.input]]
name = "ITEM"
check = "any"
repeat = { count = "itemCount" }
default = [{ str = "Hello, file!" }]

[[block]]
id = "file.exists"
version = 1
category = "files"
shape = "predicate"
output = "bool"
label = { friendly = "file %PATH exists", cpp = "std::filesystem::exists(%PATH)" }
lowering = "builtin"
help = "True when there is a file or folder at the path. A path that is not a full path is looked for in the folder the program runs in."
headers = ["<filesystem>"]

[[block.input]]
name = "PATH"
check = "text"
type = "std::string"
default = [{ str = "data.txt" }]

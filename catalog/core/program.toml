# Program structure (docs/spec/03-block-language.md §3.7.1).

[[block]]
id = "program.main"
version = 1
category = "program"
shape = "hat"
label = { friendly = "when program starts", cpp = "int main()" }
lowering = "builtin"
help = "The program starts here. A project has exactly one of these blocks."

[[block.statement]]
name = "BODY"

[[block]]
id = "program.exit"
version = 1
category = "program"
shape = "statement"
label = { friendly = "stop program with exit code %CODE", cpp = "return %CODE / std::exit(%CODE)" }
lowering = "builtin"
# In main this is `return code;`; elsewhere the generator writes
# std::exit(code) and adds <cstdlib> with it (catalog 1.3.0, M3 contracts
# types.md §5.3).
help = "Ends the program. Exit code 0 means success."

[[block.input]]
name = "CODE"
check = "integer"
default = [{ num = "0" }]

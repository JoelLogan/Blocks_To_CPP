# Program structure (docs/spec/03-block-language.md §3.7.1).

[[block]]
id = "program.main"
version = 1
category = "program"
shape = "hat"
label = { friendly = "when program starts %ARGS with arguments %ARGV", cpp = "int main(%ARGS %ARGV)" }
lowering = "builtin"
help = "The program starts here. A project has exactly one of these blocks. Tick with arguments to read what the program was started with, as a read-only list of text whose first item is the program's own name."

# W2's package C2 (catalog 1.3.0, docs/plans/m3-contracts/w2.md §1.9): the
# program's arguments, `const std::vector<std::string> args(argv, argv +
# argc);`, shown and declared only while `ARGS` is ticked.
[[block.field]]
name = "ARGS"
kind = "checkbox"
default = false

[[block.field]]
name = "ARGV"
kind = "symbol_decl"
type = "std::vector<std::string>"

[[block.statement]]
name = "BODY"

[[block]]
id = "program.exit"
version = 1
category = "program"
shape = "statement"
label = { friendly = "stop program with exit code %CODE", cpp = "return %CODE / std::exit(%CODE)" }
lowering = "builtin"
# In main this is `return code;`; elsewhere the generator writes
# std::exit(code) and adds <cstdlib> with it (catalog 1.3.0, M3 contracts
# types.md §5.3).
help = "Ends the program. Exit code 0 means success."

[[block.input]]
name = "CODE"
check = "integer"
default = [{ num = "0" }]

# W2's package S (catalog 1.3.0, docs/plans/m3-contracts/w2.md §1.6): the
# if-time blocks of package D's row. *use header* is a definition whose
# header joins the module's #include lines once; *check at compile time* is
# static_assert, its message a text field because static_assert takes a
# string literal.
[[block]]
id = "program.use_header"
version = 1
category = "program"
shape = "definition"
label = { friendly = "use header %HEADER", cpp = "#include %HEADER" }
lowering = "builtin"
help = "Includes a header of the C++ standard library, such as <cmath>, in the module's code, wherever the block is. The blocks add the headers they need themselves; this is for a header they don't name."

[[block.field]]
name = "HEADER"
kind = "header"
default = "<cmath>"

[[block]]
id = "program.check"
version = 1
category = "program"
shape = "statement"
label = { friendly = "check at compile time %COND message %MESSAGE", cpp = "static_assert(%COND, %MESSAGE);" }
lowering = "builtin"
help = "Checks a condition when the program is built, not when it runs: if it is false, the program doesn't build and the message says why. The condition may use only numbers, characters, true/false values and constants with fixed values."

[[block.field]]
name = "MESSAGE"
kind = "text"
default = "check failed"

[[block.input]]
name = "COND"
check = "bool"
default = [{ kw = "true" }]

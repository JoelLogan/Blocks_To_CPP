# Collections (docs/spec/03-block-language.md §3.7.8): lists, deques, sets, maps, queues, stacks
# and priority queues (docs/plans/m3-contracts/w2.md §1.2, types.md §1.5).
#
# A block that names its collection in a field (`LIST`, `MAP`) binds `C` from the chosen
# variable's type, so its menu lists only the variables whose type fits (slots.md §4.3); a block
# that changes the collection also lists only those that may be changed. Positions and sizes are
# `int`, and every position is checked (`.at()`).

[[block]]
id = "coll.add"
version = 1
category = "collections"
shape = "statement"
label = { friendly = "add %VALUE to %LIST", cpp = "%LIST.push_back(%VALUE);" }
lowering = "builtin"
help = "Adds a value to a collection: at the end of a list or deque, into a set, or into a queue, stack or priority queue."
where = { C = "insertable" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block.input]]
name = "VALUE"
check = "any"
type = "elem(C)"

[[block]]
id = "coll.item"
version = 1
category = "collections"
shape = "reporter"
output = "elem(C)"
label = { friendly = "item %INDEX of %LIST", cpp = "%LIST.at(%INDEX)" }
lowering = "builtin"
help = "The item at a position of a list or deque (the first is at 0), or the value for a key of a map. A position or key the collection does not have stops the program with an out-of-range error."
where = { C = "indexable" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block.input]]
name = "INDEX"
check = "any"
type = "index(C)"

[[block]]
id = "coll.set_item"
version = 1
category = "collections"
shape = "statement"
label = { friendly = "set item %INDEX of %LIST to %VALUE", cpp = "%LIST.at(%INDEX) = %VALUE;" }
lowering = "builtin"
help = "Changes the item at a position of a list or deque (the first is at 0), or sets the value for a key of a map, adding the key when the map does not have it yet. A position the list does not have stops the program with an out-of-range error."
where = { C = "indexable" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block.input]]
name = "INDEX"
check = "any"
type = "index(C)"

[[block.input]]
name = "VALUE"
check = "any"
type = "elem(C)"
assign = true

[[block]]
id = "coll.length"
version = 1
category = "collections"
shape = "reporter"
output = "int"
label = { friendly = "length of %LIST", cpp = "static_cast<int>(%LIST.size())" }
lowering = "builtin"
help = "How many items a collection has."
where = { C = "collection" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block]]
id = "coll.is_empty"
version = 1
category = "collections"
shape = "predicate"
output = "bool"
label = { friendly = "%LIST is empty", cpp = "%LIST.empty()" }
lowering = "builtin"
help = "True when a collection has no items."
where = { C = "collection" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block]]
id = "coll.list_of"
version = 1
category = "collections"
shape = "reporter"
output = "C"
label = { friendly = "list of %ITEM …", cpp = "{%ITEM, …}" }
lowering = "builtin"
help = "A list, deque or set with these items. It takes its type from where it is plugged in, such as the value of a 'create' block whose type is chosen."
# Place-typed (slots.md §3): nothing binds C, so the block takes the type its place expects.
where = { C = "listable" }

[[block.extra]]
name = "itemCount"
kind = "count"
min = 0
max = 32
default = "2"

[[block.input]]
name = "ITEM"
check = "any"
repeat = { count = "itemCount" }
type = "elem(C)"

[[block]]
id = "coll.contains"
version = 1
category = "collections"
shape = "predicate"
output = "bool"
label = { friendly = "%LIST contains %VALUE", cpp = "std::ranges::find(%LIST, %VALUE) != %LIST.end()" }
lowering = "builtin"
help = "True when a list, deque or set holds the value, or a map has the key."
where = { C = "searchable" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block.input]]
name = "VALUE"
check = "any"
type = "key(C)"

[[block]]
id = "coll.clear"
version = 1
category = "collections"
shape = "statement"
label = { friendly = "clear %LIST", cpp = "%LIST.clear();" }
lowering = "builtin"
help = "Removes every item of a collection."
where = { C = "collection" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block]]
id = "coll.remove_at"
version = 1
category = "collections"
shape = "statement"
label = { friendly = "remove item at %INDEX from %LIST", cpp = "b2c::remove_at(%LIST, %INDEX);" }
lowering = "builtin"
help = "Removes the item at a position of a list or deque (the first is at 0); the items after it move up. A position the list does not have stops the program with an out-of-range error."
where = { C = "sequence" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block.input]]
name = "INDEX"
check = "any"
type = "index(C)"

[[block]]
id = "coll.remove_value"
version = 1
category = "collections"
shape = "statement"
label = { friendly = "remove %VALUE from %LIST", cpp = "%LIST.erase(%VALUE);" }
lowering = "builtin"
help = "Removes a value from a set, or a key and its value from a map. Nothing happens when it is not there."
where = { C = "keyed" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block.input]]
name = "VALUE"
check = "any"
type = "key(C)"

[[block]]
id = "coll.next"
version = 1
category = "collections"
shape = "reporter"
output = "elem(C)"
label = { friendly = "next item of %LIST", cpp = "%LIST.front()" }
lowering = "builtin"
help = "The item a queue, stack or priority queue gives next: the oldest of a queue, the newest of a stack, the largest of a priority queue. An empty one stops the program (debug builds report it)."
where = { C = "adaptor" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block]]
id = "coll.remove_next"
version = 1
category = "collections"
shape = "statement"
label = { friendly = "remove next from %LIST", cpp = "%LIST.pop();" }
lowering = "builtin"
help = "Removes the item a queue, stack or priority queue gives next. An empty one stops the program (debug builds report it)."
where = { C = "adaptor" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block]]
id = "coll.sort"
version = 1
category = "collections"
shape = "statement"
label = { friendly = "sort %LIST %ORDER", cpp = "std::ranges::sort(%LIST);" }
lowering = "builtin"
help = "Puts the items of a list or deque in order, smallest or largest first. The items must be comparable."
where = { C = "sortable" }

[[block.field]]
name = "LIST"
kind = "symbol_ref"
type = "C"

[[block.field]]
name = "ORDER"
kind = "dropdown"
options = [["smallest first", "ascending"], ["largest first", "descending"]]
default = "ascending"

[[block]]
id = "coll.for_each"
version = 1
category = "loops"
shape = "statement"
label = { friendly = "for each %ITEM in %LIST %MODE", cpp = "for (const auto& %ITEM : %LIST) { … }" }
lowering = "builtin"
help = "Runs blocks once for each item of a list, deque, set or text, in order. Read-only items can't be changed; a copy can, without changing the collection; an editable item changes the item in the collection."
where = { C = "iterable" }

[[block.field]]
name = "ITEM"
kind = "symbol_decl"
type = "elem(C)"

[[block.field]]
name = "MODE"
kind = "dropdown"
options = [["read-only", "read_only"], ["copy", "copy"], ["editable", "editable"]]
default = "read_only"

[[block.input]]
name = "LIST"
check = "any"
type = "C"

[[block.statement]]
name = "BODY"

[[block]]
id = "coll.for_each_pair"
version = 1
category = "loops"
shape = "statement"
label = { friendly = "for each key %KEY value %VALUE in %MAP", cpp = "for (const auto& [%KEY, %VALUE] : %MAP) { … }" }
lowering = "builtin"
help = "Runs blocks once for each key of a map, smallest key first, with the key and its value. Neither can be changed."
where = { K = "value", V = "value" }

[[block.field]]
name = "MAP"
kind = "symbol_ref"
type = "std::map<K, V>"

[[block.field]]
name = "KEY"
kind = "symbol_decl"
type = "K"

[[block.field]]
name = "VALUE"
kind = "symbol_decl"
type = "V"

[[block.statement]]
name = "BODY"

# Control and loops (docs/spec/03-block-language.md §3.7.5).

[[block]]
id = "control.if"
version = 1
category = "control"
shape = "statement"
label = { friendly = "if %COND then %DO else if … else %ELSE", cpp = "if (%COND) { … } else { … }" }
lowering = "builtin"
help = "Runs blocks only when a condition is true. Add else if and else parts with ⊕, and remove them with ⊖."

[[block.extra]]
name = "elseIfCount"
kind = "count"
min = 0
max = 32
default = "0"

[[block.extra]]
name = "hasElse"
kind = "flag"
max = 1
default = false

[[block.input]]
name = "COND"
check = "bool"
repeat = { count = "elseIfCount", plus = 1 }
default = [{ kw = "true" }]

[[block.statement]]
name = "DO"
repeat = { count = "elseIfCount", plus = 1 }

[[block.statement]]
name = "ELSE"
when = "hasElse"

[[block]]
id = "control.switch"
version = 1
category = "control"
shape = "statement"
label = { friendly = "switch on %VALUE case %CASE %DO case … default %DEFAULT", cpp = "switch (%VALUE) { case %CASE: { … break; } … default: { … } }" }
lowering = "builtin"
help = "Runs the blocks of the case whose value equals the value switched on, or the default part when no case does. The value is a whole number, a character or a value of an enum; each case value must be fixed when the program is built, and no two may be the same. Add cases and the default part with ⊕, and remove them with ⊖."
where = { T = "switchable" }

[[block.extra]]
name = "caseCount"
kind = "count"
min = 1
max = 64
default = "2"

[[block.extra]]
name = "hasDefault"
kind = "flag"
max = 1
default = true

[[block.input]]
name = "VALUE"
check = "any"
type = "T"

# Case values start empty: a connection never sets a start value
# (docs/plans/m3-contracts/w2.md §2.9).
[[block.input]]
name = "CASE"
check = "any"
type = "T"
repeat = { count = "caseCount" }

[[block.statement]]
name = "DO"
repeat = { count = "caseCount" }

[[block.statement]]
name = "DEFAULT"
when = "hasDefault"

[[block]]
id = "control.while"
version = 1
category = "loops"
shape = "statement"
label = { friendly = "repeat %MODE %COND", cpp = "while (%COND) { … }" }
lowering = "builtin"
help = "Repeats blocks while a condition is true; choose until in the menu to repeat until it becomes true."

[[block.field]]
name = "MODE"
kind = "dropdown"
options = [["while", "while"], ["until", "until"]]
default = "while"

[[block.input]]
name = "COND"
check = "bool"
default = [{ kw = "true" }]

[[block.statement]]
name = "BODY"

[[block]]
id = "control.do_while"
version = 1
category = "loops"
shape = "statement"
label = { friendly = "do %BODY then repeat %MODE %COND", cpp = "do { … } while (%COND);" }
lowering = "builtin"
help = "Runs blocks once, then again while a condition is true; choose until in the menu to repeat until it becomes true. The condition sees only what is visible before the block, not the variables its blocks create."

[[block.statement]]
name = "BODY"

[[block.field]]
name = "MODE"
kind = "dropdown"
options = [["while", "while"], ["until", "until"]]
default = "while"

[[block.input]]
name = "COND"
check = "bool"
default = [{ kw = "true" }]

[[block]]
id = "control.repeat"
version = 1
category = "loops"
shape = "statement"
label = { friendly = "repeat %TIMES times", cpp = "for (int i = 0; i < %TIMES; ++i) { … }" }
lowering = "builtin"
help = "Repeats blocks a number of times."

[[block.input]]
name = "TIMES"
check = "integer"
default = [{ num = "10" }]

[[block.statement]]
name = "BODY"

[[block]]
id = "control.for_range"
version = 1
category = "loops"
shape = "statement"
label = { friendly = "for %VAR from %FROM %DIRECTION %TO step %STEP", cpp = "for (int %VAR = %FROM; …; …) { … }" }
lowering = "builtin"
help = "Counts from one number to another, running blocks for each value."

[[block.field]]
name = "VAR"
kind = "symbol_decl"

[[block.field]]
name = "DIRECTION"
kind = "dropdown"
options = [["to", "to"], ["through", "through"], ["down to", "down_to"]]
default = "to"

[[block.input]]
name = "FROM"
check = "integer"
default = [{ num = "0" }]

[[block.input]]
name = "TO"
check = "integer"
default = [{ num = "10" }]

[[block.input]]
name = "STEP"
check = "integer"
optional = true

[[block.statement]]
name = "BODY"

[[block]]
id = "control.forever"
version = 1
category = "loops"
shape = "statement"
label = { friendly = "forever", cpp = "while (true) { … }" }
lowering = "builtin"
help = "Repeats blocks forever (use stop or break to leave)."

[[block.statement]]
name = "BODY"

[[block]]
id = "control.break"
version = 1
category = "loops"
shape = "statement"
label = { friendly = "leave loop", cpp = "break;" }
lowering = "builtin"
help = "Leaves the innermost loop."

[[block]]
id = "control.continue"
version = 1
category = "loops"
shape = "statement"
label = { friendly = "skip to next round", cpp = "continue;" }
lowering = "builtin"
help = "Skips the rest of this round of the innermost loop."

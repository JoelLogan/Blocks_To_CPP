# Variables (docs/spec/03-block-language.md §3.7.2).

[[block]]
id = "var.declare"
version = 1
category = "variables"
shape = "statement"
label = { friendly = "create %TYPE variable %NAME = %VALUE constant %CONST", cpp = "%TYPE %NAME = %VALUE;" }
lowering = "builtin"
help = "Creates a variable. It can be used by the blocks after it in the same place."
# The type field binds T (catalog 1.3.0): it offers its types and takes any
# type a variable can hold; the name is declared with T, and the value
# converts to it. `auto` binds nothing. The lists after M2's types stand in
# for the type picker until it arrives (docs/plans/m3-contracts/w2.md §1.2).
where = { T = "value" }

[[block.field]]
name = "TYPE"
kind = "type"
types = ["int", "double", "bool", "char", "std::string", "auto", "std::vector<int>", "std::vector<double>", "std::vector<std::string>"]
default = "int"
type = "T"

[[block.field]]
name = "NAME"
kind = "symbol_decl"
type = "T"

[[block.field]]
name = "CONST"
kind = "checkbox"
default = false

[[block.input]]
name = "VALUE"
check = "any"
optional = true
type = "T"

[[block]]
id = "var.global"
version = 1
category = "variables"
shape = "definition"
label = { friendly = "global %KIND %TYPE %NAME = %VALUE share with other modules %SHARED", cpp = "%TYPE %NAME = %VALUE;" }
lowering = "builtin"
help = "Creates a variable, or a constant, that every function of the module can use, wherever the block is. A constant needs a value and never changes."
# Like *create*, the type field binds T and the name is declared with it; a
# global has no `auto` (docs/plans/m3-contracts/w2.md §1.9, §2.7).
where = { T = "value" }

[[block.field]]
name = "KIND"
kind = "dropdown"
options = [["variable", "variable"], ["constant", "constant"]]
default = "variable"

[[block.field]]
name = "TYPE"
kind = "type"
types = ["int", "double", "bool", "char", "std::string", "std::vector<int>", "std::vector<double>", "std::vector<std::string>"]
default = "int"
type = "T"

[[block.field]]
name = "NAME"
kind = "symbol_decl"
type = "T"

[[block.input]]
name = "VALUE"
check = "any"
optional = true
type = "T"

# Shown once projects have several modules (milestone M3's third wave).
[[block.field]]
name = "SHARED"
kind = "checkbox"
default = false

[[block]]
id = "var.set"
version = 1
category = "variables"
shape = "statement"
label = { friendly = "set %VAR to %VALUE", cpp = "%VAR = %VALUE;" }
lowering = "builtin"
help = "Gives a variable a new value."
# The variable binds T (catalog 1.3.0); the value is assigned to it, so a
# character also fits a text variable, and it never binds T itself.
where = { T = "value" }

[[block.field]]
name = "VAR"
kind = "symbol_ref"
type = "T"

[[block.input]]
name = "VALUE"
check = "any"
type = "T"
assign = true

# `OP` was added in catalog 1.2.0, when `change` took over the retired
# `var.update` (03 §3.11.3, ADR-0015): a compatible change, so the version
# stays 1 and a block saved without `OP` adds.
[[block]]
id = "var.change"
version = 1
category = "variables"
shape = "statement"
label = { friendly = "change %VAR %OP %BY", cpp = "%VAR %OP %BY;" }
lowering = "builtin"
help = "Adds to a variable (+=); choose down by (-=), times (*=), divided by (/=) or mod (%=) in the menu to subtract, multiply, divide or keep the remainder instead."

[[block.field]]
name = "VAR"
kind = "symbol_ref"

[[block.field]]
name = "OP"
kind = "dropdown"
options = [["by", "add"], ["down by", "sub"], ["times", "mul"], ["divided by", "div"], ["mod", "mod"]]
default = "add"

[[block.input]]
name = "BY"
check = "number"
default = [{ num = "1" }]

[[block]]
id = "var.get"
version = 1
category = "variables"
shape = "reporter"
output = "symbol"
label = { friendly = "%VAR", cpp = "%VAR" }
lowering = "builtin"
help = "The value of a variable."

[[block.field]]
name = "VAR"
kind = "symbol_ref"

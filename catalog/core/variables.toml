# Variables (docs/spec/03-block-language.md §3.7.2).

[[block]]
id = "var.declare"
version = 1
category = "variables"
shape = "statement"
label = { friendly = "create %TYPE variable %NAME = %VALUE constant %CONST", cpp = "%TYPE %NAME = %VALUE;" }
lowering = "builtin"
help = "Creates a variable. It can be used by the blocks after it in the same place."
# The type field binds T (catalog 1.3.0): it offers its types and takes any
# type a variable can hold; the name is declared with T, and the value
# converts to it. `auto` binds nothing.
where = { T = "value" }

[[block.field]]
name = "TYPE"
kind = "type"
types = ["int", "double", "bool", "char", "std::string", "auto"]
default = "int"
type = "T"

[[block.field]]
name = "NAME"
kind = "symbol_decl"
type = "T"

[[block.field]]
name = "CONST"
kind = "checkbox"
default = false

[[block.input]]
name = "VALUE"
check = "any"
optional = true
type = "T"

[[block]]
id = "var.set"
version = 1
category = "variables"
shape = "statement"
label = { friendly = "set %VAR to %VALUE", cpp = "%VAR = %VALUE;" }
lowering = "builtin"
help = "Gives a variable a new value."
# The variable binds T (catalog 1.3.0); the value is assigned to it, so a
# character also fits a text variable, and it never binds T itself.
where = { T = "value" }

[[block.field]]
name = "VAR"
kind = "symbol_ref"
type = "T"

[[block.input]]
name = "VALUE"
check = "any"
type = "T"
assign = true

# `OP` was added in catalog 1.2.0, when `change` took over the retired
# `var.update` (03 §3.11.3, ADR-0015): a compatible change, so the version
# stays 1 and a block saved without `OP` adds.
[[block]]
id = "var.change"
version = 1
category = "variables"
shape = "statement"
label = { friendly = "change %VAR %OP %BY", cpp = "%VAR %OP %BY;" }
lowering = "builtin"
help = "Adds to a variable (+=); choose down by (-=), times (*=), divided by (/=) or mod (%=) in the menu to subtract, multiply, divide or keep the remainder instead."

[[block.field]]
name = "VAR"
kind = "symbol_ref"

[[block.field]]
name = "OP"
kind = "dropdown"
options = [["by", "add"], ["down by", "sub"], ["times", "mul"], ["divided by", "div"], ["mod", "mod"]]
default = "add"

[[block.input]]
name = "BY"
check = "number"
default = [{ num = "1" }]

[[block]]
id = "var.get"
version = 1
category = "variables"
shape = "reporter"
output = "symbol"
label = { friendly = "%VAR", cpp = "%VAR" }
lowering = "builtin"
help = "The value of a variable."

[[block.field]]
name = "VAR"
kind = "symbol_ref"

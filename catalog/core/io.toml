# Input / Output (docs/spec/03-block-language.md §3.7.6).

[[block]]
id = "io.print"
version = 1
category = "io"
shape = "statement"
label = { friendly = "print %ITEM … %SEP new line %NEWLINE to %STREAM", cpp = "std::cout << %ITEM << …;" }
lowering = "builtin"
headers = ["<iostream>"]
help = "Shows values in the console."

[[block.field]]
name = "SEP"
kind = "dropdown"
options = [["no separator", "none"], ["spaces", "space"], ["commas", "comma"]]
default = "none"

[[block.field]]
name = "NEWLINE"
kind = "checkbox"
default = true

[[block.field]]
name = "STREAM"
kind = "dropdown"
options = [["the console", "out"], ["the error stream", "err"]]
default = "out"

[[block.extra]]
name = "itemCount"
kind = "count"
min = 1
max = 32
default = "1"

[[block.input]]
name = "ITEM"
check = "any"
repeat = { count = "itemCount" }
default = [{ str = "Hello, world!" }]

[[block]]
id = "io.ask"
version = 1
category = "io"
shape = "statement"
label = { friendly = "ask %PROMPT and save answer in %VAR (%MODE)", cpp = "std::cin >> %VAR;" }
lowering = "builtin"
# Only some forms need <string> (a text answer) or <limits> (a simple ask
# for a number): the generator adds them with the form (catalog 1.3.0, M3
# contracts types.md §5.3).
headers = ["<iostream>"]
help = "Asks the user to type something and stores it in a variable."

[[block.field]]
name = "VAR"
kind = "symbol_ref"

[[block.field]]
name = "MODE"
kind = "dropdown"
options = [["keep asking until valid", "keep_asking"], ["simple", "simple"]]
default = "keep_asking"

[[block.input]]
name = "PROMPT"
check = "text"
optional = true

# Milestone M3's second wave (docs/plans/m3-contracts/w2.md §1.4).

[[block]]
id = "io.decimals"
version = 1
category = "io"
shape = "statement"
label = { friendly = "show numbers with %DIGITS decimal places", cpp = "std::cout << std::fixed << std::setprecision(%DIGITS);" }
lowering = "builtin"
headers = ["<iomanip>", "<iostream>"]
help = "From here on, prints every decimal number with this many digits after the decimal point, also in join and as text. Whole numbers are not changed."

[[block.input]]
name = "DIGITS"
check = "integer"
type = "int"
default = [{ num = "2" }]

# Fuzz targets for the project loader, the pure pipeline, the typed text
# encoders and the compiler-diagnostics parsers
# (docs/spec/09-quality-and-delivery.md §9.2, docs/spec/08-security.md §8.4 and
# §8.13). No target performs I/O: they call pure functions only (from
# b2c-toolchain, only the `parse_*` diagnostics functions).
#
# Not part of the main workspace: libFuzzer needs a nightly toolchain and
# sanitizer flags. Run with `cargo +nightly fuzz run <target>` from the
# repository root; see fuzz/README.md.

[package]
name = "b2c-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# libFuzzer bindings for cargo-fuzz; the fuzzing harness only, never shipped.
libfuzzer-sys = "=0.4.13"
b2c-ir = { path = "../crates/b2c-ir" }
b2c-model = { path = "../crates/b2c-model" }
b2c-catalog = { path = "../crates/b2c-catalog" }
b2c-lang = { path = "../crates/b2c-lang" }
b2c-codegen = { path = "../crates/b2c-codegen" }
# For its pure diagnostics parsers only (`b2c_toolchain::diagnostics`).
b2c-toolchain = { path = "../crates/b2c-toolchain" }

# Its own workspace, so the main workspace's `crates/*` glob and its lints
# do not apply and `cargo` commands at the root ignore this package.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "load"
path = "fuzz_targets/load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve"
path = "fuzz_targets/resolve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frontend"
path = "fuzz_targets/frontend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encoders"
path = "fuzz_targets/encoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diag_sarif"
path = "fuzz_targets/diag_sarif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diag_json"
path = "fuzz_targets/diag_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diag_text"
path = "fuzz_targets/diag_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diag_output"
path = "fuzz_targets/diag_output.rs"
test = false
doc = false
bench = false
